<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Verifiable RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=15" />
</head>
<body>
  <div class="app">
    <button type="button" id="railToggle" class="rail-toggle" aria-expanded="false" aria-controls="rail">
      Belgeler
    </button>
    <div id="railBackdrop" class="rail-backdrop" hidden></div>

    <aside class="rail" id="rail">
      <div class="brand">
        <strong>Verifiable RAG</strong>
        <span>Muhammed Beşir Kesen</span>
        <div id="runtimeStatus" class="status-badge is-loading" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-text">Motor yükleniyor…</span>
        </div>
      </div>

      <label class="upload">
        Belge yükle
        <input id="fileInput" type="file" accept=".pdf,.txt" multiple />
      </label>
      <label class="source-label" for="sourceSelect">Belge</label>
      <select id="sourceSelect" class="source-select">
        <option value="">Tüm belgeler</option>
      </select>
      <ul id="fileList" class="files"></ul>
      <p id="emptyFiles" class="muted">Henüz belge yok.</p>

      <button type="button" id="clearChat" class="clear-chat">Sohbeti Temizle</button>
    </aside>

    <main class="chat">
      <div id="thread" class="thread"></div>
      <form id="composer" class="composer">
        <textarea
          id="query"
          rows="1"
          placeholder="Belgen hakkında sor… (Enter gönder, Shift+Enter satır)"
          autocomplete="off"
          enterkeyhint="send"
        ></textarea>
        <button type="submit" id="sendBtn">Gönder</button>
      </form>
    </main>
  </div>
  <script src="/static/app.js?v=15"></script>
</body>
</html>
